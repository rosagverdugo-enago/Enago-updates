name: Check Enago Assignments

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run assignment check
        env:
          ENAGO_EMAIL: ${{ secrets.ENAGO_EMAIL }}
          ENAGO_PASSWORD: ${{ secrets.ENAGO_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_assignments.py

      - name: Save updated state
        run: |
          git config user.name "assignment-watcher-bot"
          git config user.email "actions@github.com"
          git add seen_assignments.json
          git diff --staged --quiet || git commit -m "Update seen assignments state"
          git pull --rebase origin main
          git push
